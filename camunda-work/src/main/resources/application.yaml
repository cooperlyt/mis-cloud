logging:
  level:
    com.netflix: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    io.github.cooperlyt: DEBUG
#    org.camunda.bpm: DEBUG
#    org.camunda.bpm.engine: TRACE
#    org.mybatis: DEBUG
#    org.springframework: DEBUG
# # http://127.0.0.1:19005/camunda/app/welcome/default/
server:
  port: 8080
  servlet.context-path: /camunda

management:
  health.probes.enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always


camunda.bpm:
  eventing:
    execution: true
    task: true
    history: false
    skippable: true
  historyLevel: audit
  database:
    jdbcBatchProcessing: false
    schema-update: drop-create
    type: mysql # 不支持 mariadb 使用 mysql
#  webapp:
#    index-redirect-enabled: true
  authorization:
    enabled: true
  generic-properties:
    properties:
      enableExpressionsInAdhocQueries: true
  run:
    auth.enabled: true
    cors:
      enabled: true
      allowed-origins: "*"
  filter:
    create: All tasks
  webapp.application-path:

keycloak:
  realms: ${KEYCLOAK_REALM:house-sale}
  url.auth: ${KEYCLOAK_URI:https://192.168.1.21:8443}
#  ${KEYCLOAK_URL_AUTH:https://192.168.1.21:8443}
  url.token: ${KEYCLOAK_URI:https://192.168.1.21:8443}
  url.plugin: ${KEYCLOAK_URI:https://192.168.1.21:8443}
  client.id: ${KEYCLOAK_CLIENT_ID:camunda-identity-service}
  client.secret: ${KEYCLOAK_CLIENT_SECRET:7Osuidv7klOGg80FruUrm6bDFvg4SnQr}

plugin.identity.keycloak:
  keycloakIssuerUrl: ${keycloak.url.plugin}/realms/${keycloak.realms}
  keycloakAdminUrl: ${keycloak.url.plugin}/admin/realms/${keycloak.realms}
  clientId: ${keycloak.client.id}
  clientSecret: ${keycloak.client.secret}
  useEmailAsCamundaUserId: false
  useUsernameAsCamundaUserId: true
  useGroupPathAsCamundaGroupId: true
  administratorGroupName: camunda-admin
  disableSSLCertificateValidation: true

rest.security:
  enabled: true
  provider: keycloak
  required-audience: camunda-rest-api

spring:
  application:
    name: camunda
  profiles:
    active: local
  cloud:
    loadbalancer:
      cache:
        enabled: true
        caffeine:
          spec: initialCapacity=500,expireAfterWrite=5s
    consul:
      ribbon:
        enabled: false
      config:
        enabled: false
        format: yaml
        prefixes: config
        profile-separator: ':'
        data-key: data
      discovery:
        serviceName: ${spring.application.name}
        # 启用服务发现
        enabled: true
        # 启用服务注册
        register: true
        # 服务停止时取消注册
        deregister: true
        # 表示注册时使用IP而不是hostname
        prefer-ip-address: true
        # 执行监控检查的频率
        health-check-interval: 30s
        # 设置健康检查失败多长时间后，取消注册
        health-check-critical-timeout: 30s
        # 健康检查的路径
        health-check-path: ${server.servlet.context-path}/actuator/info
        # 服务注册标识，格式为：应用名称+服务器IP+端口
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    function:
      definition: workCreateChannel;workEventChannel
    stream:
      bindings:
        workCreateChannel-in-0:
          destination: work-create #RabbitMq 消费和交换机无关
          group: camunda.work.create #RabbitMQ 队列名
#        signalEventChannel-in-0:
#          destination: work
#          group: camunda.work.signal

        workEventChannel-in-0:
          destination: work-event
          group: camunda.work.event

        processChangedChannel-out-0:
          destination: work # Rabbit 交换机名
        statusChangedChannel-out-0:
          destination: work

      default-binder: rabbit
      default:
        content-type: application/json
        producer:
          error-channel-enabled: true
        consumer:
          maxAttempts: 10
        #            backOffInitialInterval:
        #            backOffMultipler:
        #            backOffMaxInterval:
        #            retryableExceptions:
        #              java:
        #                lang:
        #                  IllegalStateException: true

      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                publisher-confirm-type: correlated
                publisher-returns: true
                host: ${RABBIT_HOST:rabbit}
                port: ${RABBIT_PORT:5672}
                virtual-host: construction
                username: app
                password: onqbMBU4NVoEJlM2EabSlh3o1PWMrXa7
                # / admin FeiPu@2024



      rabbit:
        default:
          producer:
            useConfirmHeader: true
          consumer:
            acknowledge-mode: manual
            auto-bind-dlq: true
            batch-mode: false
            bindQueue: false
            declareExchange: false
            queueNameGroupOnly: true
          bindings:
            processChangedChannel-out-0:
              producer:
                #              useConfirmHeader: true
                routingKeyExpression: "headers['define'] + '.work.process.changed'"
            statusChangedChannel-out-0:
              producer:
                routingKeyExpression: "headers['define'] + '.work.status.changed'"


#      rocketmq:
#        binder:
#          nameServer: ${MQ_ADDR:namesrv:9876}
#        bindings:
#          processCreateChannel-in-0:
#            consumer:
#              subscription: sql:(type = 'RUNNING')
#          signalEventChannel-in-0:
#            consumer:
#              enabled: true
#          eventEventChannel-in-0:
#            consumer:
#              enabled: true
#          processChangeChannel-out-0:
#            producer:
#              group: group-camunda-change
#          statusChangeChannel-out-0:
#            producer:
#              group: group-camunda-status

#              transactionListener: processStatusChangeTransactionListener
#              producerType: Trans
#              sendMessageTimeout: 60000
  jersey:
    applicationPath: /engine-rest
  security:
    oauth2:
      resource-server:
        jwt:
#          issuer-uri: ${keycloak.url.auth}/realms/${keycloak.realms}
          jwk-set-uri: ${keycloak.url.token}/realms/${keycloak.realms}/protocol/openid-connect/certs
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${keycloak.client.id}
            client-secret: ${keycloak.client.secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: ${keycloak.url.auth}/realms/${keycloak.realms}
            authorization-uri: ${keycloak.url.auth}/realms/${keycloak.realms}/protocol/openid-connect/auth
            user-info-uri: ${keycloak.url.auth}/realms/${keycloak.realms}/protocol/openid-connect/userinfo
            token-uri: ${keycloak.url.token}/realms/${keycloak.realms}/protocol/openid-connect/token
            jwk-set-uri: ${keycloak.url.token}/realms/${keycloak.realms}/protocol/openid-connect/certs
            # set user-name-attribute one of:
            # - sub                -> default; using keycloak ID as camunda user ID
            # - email              -> useEmailAsCamundaUserId=true
            # - preferred_username -> useUsernameAsCamundaUserId=true
            user-name-attribute: preferred_username
  datasource:
    testWhileIdle: "true"
    validationQuery: "SELECT 1"
    url: ${DB_URL:jdbc:mariadb://db:3306/camunda?sessionVariables=transaction_isolation='READ-COMMITTED'&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false&nullDatabaseMeansCurrent=true&nullCatalogMeansCurrent=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PWD:5257mq}
    driver-class-name: "org.mariadb.jdbc.Driver"
    hikari:
      connection-init-sql: "SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED"
# 在 MariaDB 10.3 及以上，transaction_isolation 可能被支持（与 MySQL 兼容），但您的 MariaDB 版本可能较低（如 10.2 或更早），仍使用 tx_isolation。
#  实测在 mariadb 10.10 docker 版中依然不好使， 如果更新mariadb 版本可以测试一下  https://github.com/sameersbn/docker-redmine/issues/531
# 注意，这是JDBC! , R2DBC 有自已的参数 isolationLevel

